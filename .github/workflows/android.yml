name: Android APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["featurescript/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка debug APK (offline и api)
        run: ./gradlew --no-daemon --stacktrace assembleOfflineDebug assembleApiDebug

      - name: Проверка разрешений (в offline нет INTERNET)
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            echo "== $apk"
            "$AAPT" dump permissions "$apk" | tee "$apk.permissions.txt"
          done
          OFFLINE=$(ls app/build/outputs/apk/offline/debug/*.apk)
          if "$AAPT" dump permissions "$OFFLINE" | grep -q "android.permission.INTERNET"; then
            echo "::error::В сборке offline найдено разрешение INTERNET"; exit 1
          fi

      - name: APK — артефакт для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: ration-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/offline/debug/*.apk
            app/build/outputs/apk/api/debug/*.apk
            app/build/outputs/apk/*/debug/*.permissions.txt
          if-no-files-found: error
          retention-days: 30

      - name: Юнит-тесты
        run: ./gradlew --no-daemon testOfflineDebugUnitTest

      - name: Lint
        run: |
          ./gradlew --no-daemon lintOfflineDebug || {
            cat app/build/intermediates/lint_intermediate_text_report/offlineDebug/lintReportOfflineDebug/lint-results-offlineDebug.txt | grep -B2 -A12 "Error:" ; exit 1; }

      - name: Отчёты тестов и lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  old:
    name: Прежняя версия (для проверки обновления)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка версии 1.0.0 (БД v1) с тем же debug-ключом
        run: |
          mkdir -p ~/.android && cp app/debug.keystore ~/.android/debug.keystore
          git fetch --depth=1 origin 5d542e3909b50245d7683def73381a0294d77778
          git worktree add "$RUNNER_TEMP/old" FETCH_HEAD
          cd "$RUNNER_TEMP/old" && ./gradlew --no-daemon assembleOfflineDebug
          mkdir -p "$GITHUB_WORKSPACE/old-apk"
          cp app/build/outputs/apk/offline/debug/*.apk "$GITHUB_WORKSPACE/old-apk/"

      - uses: actions/upload-artifact@v4
        with:
          name: ration-old-apk-${{ github.sha }}
          path: old-apk/*.apk
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: Запуск на эмуляторе
    needs: [build, old]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: APK из сборки
        uses: actions/download-artifact@v4
        with:
          name: ration-apk-${{ github.sha }}
          path: apk

      - name: Прежняя APK
        uses: actions/download-artifact@v4
        with:
          name: ration-old-apk-${{ github.sha }}
          path: old-apk

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Смоук-тест offline APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh apk old-apk

      - name: Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat-${{ github.sha }}
          path: smoke-logcat.txt
          if-no-files-found: ignore
